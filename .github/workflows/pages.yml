# Publishes www.pomentum.dev. GitHub Pages' source is this workflow (Settings, Pages, Source: GitHub Actions), not the branch:
# it builds Syrmos's page from syrmos-site/ and publishes only the files listed in "Assemble", so the repository's notes
# (README.md, AGENTS.md, CLAUDE.md) and the page's source are never public. A new public file goes on that list.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits rather than cancelling one that is publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: syrmos-site/package-lock.json

      - name: Build Syrmos's page and its use cases
        working-directory: syrmos-site
        run: |
          npm ci
          npm run build

      - name: Assemble the published files
        run: |
          mkdir _site
          cp index.html 404.html style.css theme.js favicon.svg robots.txt _site/
          cp -r syrmos _site/syrmos
          cp -r use-cases _site/use-cases
          mv _site/syrmos/sitemap.xml _site/syrmos/llms.txt _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
