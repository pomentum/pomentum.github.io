# Publish this repository's files, as they are, on https://pomentum.github.io/.
# The site is plain HTML and CSS: there is nothing to build.
# Needs: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the site's files
        run: |
          mkdir _site
          cp index.html 404.html style.css theme.js favicon.svg robots.txt .nojekyll _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
